name: Bygg firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: STM32F103RE_creality   # Creality V4.2.7
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('Marlin/platformio.ini', 'Marlin/ini/*.ini') }}

      - name: Installera PlatformIO
        run: pip install platformio

      - name: Kopiera in config
        run: ./scripts/apply-config.sh

      - name: Bygg
        working-directory: Marlin
        run: pio run -e "$PIO_ENV"

      - name: Ladda upp firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: Marlin/.pio/build/${{ env.PIO_ENV }}/*.bin
